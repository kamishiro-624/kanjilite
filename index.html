<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KanjiLite – an unofficial WaniKani client</title>
  <meta name="description" content="A small, static client for WaniKani: dashboard, lessons, reviews and a level browser.">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E鰐%3C/text%3E%3C/svg%3E">
  <script>try{var t=localStorage.getItem('kl_theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;}catch(e){}</script>
  <link rel="stylesheet" href="css/style.css?v=10">
</head>
<body>
  <header class="topbar" id="topbar">
    <a class="brand" href="#/"><span class="brand-mark" aria-hidden="true">鰐</span><span class="brand-name">KanjiLite</span></a>
    <nav class="nav" id="nav" hidden>
      <a href="#/" data-nav="">Home</a>
      <a href="#/levels" data-nav="levels">Levels</a>
      <a href="#/search" data-nav="search">Search</a>
      <a href="#/plan" data-nav="plan">Plan</a>
      <a href="#/stats" data-nav="stats">Stats</a>
      <button type="button" id="open-settings" aria-label="Settings">Settings</button>
    </nav>
  </header>

  <main id="app" aria-live="polite"></main>

  <div id="toast" role="status"></div>

  <dialog id="modal">
    <div class="modal-inner">
      <button type="button" class="modal-x" data-close aria-label="Close">Close</button>
      <div id="modal-body"></div>
    </div>
  </dialog>

  <dialog id="confirm" class="confirm" aria-labelledby="confirm-title" aria-describedby="confirm-msg">
    <div class="confirm-inner">
      <h2 id="confirm-title"></h2>
      <p id="confirm-msg" class="muted"></p>
      <div class="confirm-actions">
        <button type="button" class="btn ghost" id="confirm-cancel">Cancel</button>
        <button type="button" class="btn" id="confirm-ok">OK</button>
      </div>
    </div>
  </dialog>

  <script src="js/config.js"></script>
  <script src="js/sync.js?v=2"></script>
  <script src="js/logic/kana.js"></script>
  <script src="js/logic/check.js?v=2"></script>
  <script src="js/logic/search.js?v=1"></script>
  <script src="js/logic/pitch.js?v=1"></script>
  <script src="js/data/api.js?v=5"></script>
  <script src="js/data/store.js?v=5"></script>
  <script src="js/data/stats.js?v=3"></script>
  <script src="js/logic/plan.js?v=2"></script>
  <script src="js/ui/ui.js?v=2"></script>
  <script src="js/ui/charts.js?v=2"></script>
  <script src="js/ui/heatmap.js?v=1"></script>
  <script src="js/ui/dashboard.js?v=3"></script>
  <script src="js/ui/statsview.js?v=4"></script>
  <script src="js/ui/searchview.js?v=1"></script>
  <script src="js/ui/pitchview.js?v=1"></script>
  <script src="js/ui/audio.js?v=2"></script>
  <script src="js/ui/notify.js?v=1"></script>
  <script src="js/ui/planview.js?v=4"></script>
  <script src="js/app.js?v=15"></script>
</body>
</html>
